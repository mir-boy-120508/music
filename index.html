<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A Endless Loop Player & Lyrics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-effect { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); }
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            height: 6px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #818cf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.8);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- HTML5 Audio Element (iOS バックグラウンド再生のコア) -->
    <audio id="audio-player" playsinline preload="auto" loop></audio>

    <header class="w-full p-4 md:p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400 glow-effect">
                <i class="fa-solid font-bold fa-rotate-right text-lg animate-spin-slow"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-300 via-white to-purple-300 bg-clip-text text-transparent">Endless Loop & Lyrics</h1>
                <p class="text-xs text-slate-400">iOS Compatible Loop Player</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="shortcuts-btn" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/60 transition flex items-center gap-1.5">
                <i class="fa-solid fa-keyboard"></i>
                <span class="hidden sm:inline">ショートカット</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full gap-6">
        
        <div id="drop-zone" class="w-full relative glass-panel rounded-3xl p-6 md:p-8 border border-slate-800 transition-all duration-300 group flex flex-col items-center justify-between min-h-[320px] md:min-h-[380px] overflow-hidden">
            
            <div class="absolute -top-24 -left-24 w-60 h-60 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div id="upload-prompt" class="relative z-10 my-auto flex flex-col items-center text-center p-6 space-y-4 transition-all duration-300">
                <div class="w-20 h-20 rounded-full bg-slate-900/80 border border-indigo-500/30 flex items-center justify-center text-indigo-400 group-hover:scale-110 group-hover:border-indigo-400 transition duration-300 glow-effect">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
                </div>
                <div>
                    <p class="text-lg font-semibold text-slate-200">音声ファイル・LRC歌詞をドロップ</p>
                    <p class="text-sm text-slate-400 mt-1">またはクリックして選択 (MP3, M4A, WAV & .lrc 対応)</p>
                </div>
                <div class="flex flex-wrap justify-center gap-3">
                    <label for="file-input" class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30 hover:shadow-indigo-500/50 flex items-center gap-2">
                        <i class="fa-solid fa-file-audio"></i>
                        <span>曲を選択</span>
                    </label>
                    <label for="lrc-input" class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/30 font-medium px-5 py-2.5 rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-file-lines"></i>
                        <span>歌詞 (.lrc) 選択</span>
                    </label>
                </div>
                <input type="file" id="file-input" accept="audio/*,.m4a" class="hidden">
                <input type="file" id="lrc-input" accept=".lrc" class="hidden">
            </div>

            <div id="track-info" class="relative z-10 hidden flex-col justify-between items-center text-center w-full h-full min-h-[300px] pointer-events-none">
                <div class="w-full flex flex-col items-center space-y-2 pt-2">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-medium backdrop-blur-md">
                        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
                        <span id="loop-mode-tag">無限ループ有効</span>
                    </div>
                    <h2 id="song-title" class="text-2xl md:text-3xl font-bold text-white tracking-wide truncate w-full px-4 drop-shadow-md">---</h2>
                    <p id="song-meta" class="text-xs text-slate-400 drop-shadow">00:00 / 00:00</p>
                </div>

                <div class="flex-1 w-full flex items-center justify-center p-4 my-auto">
                    <p id="lyrics-display" class="text-lg md:text-2xl font-semibold text-indigo-100 transition-opacity duration-200 drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)] text-center leading-relaxed">
                    </p>
                </div>
            </div>
        </div>

        <div class="w-full glass-panel rounded-2xl p-4 md:p-6 space-y-4">
            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400 font-mono">
                    <span id="current-time">00:00</span>
                    <span id="duration-time">00:00</span>
                </div>
                <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" class="w-full cursor-pointer accent-indigo-500">
            </div>

            <div class="flex items-center justify-between pt-2">
                <div class="flex items-center gap-2">
                    <button id="loop-toggle-btn" title="ループ切り替え (L)" class="p-2.5 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-600/30 transition flex items-center gap-2">
                        <i class="fa-solid fa-repeat text-base"></i>
                        <span class="text-xs font-semibold hidden sm:inline" id="loop-btn-text">無限ループ ON</span>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <button id="rewind-btn" title="5秒戻る (←)" class="p-3 text-slate-400 hover:text-white transition">
                        <i class="fa-solid fa-rotate-left text-lg"></i>
                    </button>

                    <button id="play-btn" title="再生/一時停止 (Space)" class="w-14 h-14 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-400 hover:from-indigo-500 hover:to-indigo-300 text-white flex items-center justify-center text-xl shadow-lg shadow-indigo-500/40 hover:scale-105 active:scale-95 transition">
                        <i id="play-icon" class="fa-solid fa-play ml-1"></i>
                    </button>

                    <button id="forward-btn" title="5秒進む (→)" class="p-3 text-slate-400 hover:text-white transition">
                        <i class="fa-solid fa-rotate-right text-lg"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2 w-28 sm:w-36 justify-end">
                    <button id="mute-btn" title="消音 (M)" class="text-slate-400 hover:text-white transition p-1">
                        <i id="mute-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.8" class="w-16 sm:w-24 cursor-pointer accent-indigo-500">
                </div>
            </div>
        </div>

    </main>

    <div id="shortcuts-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 space-y-4 border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-indigo-400"></i> キーボードショートカット
                </h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-2 text-sm text-slate-300">
                <div class="flex justify-between py-1.5 border-b border-slate-800/50">
                    <span>再生 / 一時停止</span>
                    <kbd class="px-2 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-xs text-indigo-300">Space</kbd>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-800/50">
                    <span>ループ機能 ON/OFF</span>
                    <kbd class="px-2 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-xs text-indigo-300">L</kbd>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-800/50">
                    <span>ミュート / 解除</span>
                    <kbd class="px-2 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-xs text-indigo-300">M</kbd>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-800/50">
                    <span>5秒戻る / 進む</span>
                    <kbd class="px-2 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-xs text-indigo-300">← / →</kbd>
                </div>
            </div>
        </div>
    </div>

    <footer class="w-full p-4 text-center text-xs text-slate-500">
        Endless Loop Player &copy; iOS Background Play Compatible
    </footer>

    <script>
        // DOM Elements
        const audioPlayer = document.getElementById('audio-player');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const lrcInput = document.getElementById('lrc-input');
        const uploadPrompt = document.getElementById('upload-prompt');
        const trackInfo = document.getElementById('track-info');
        const songTitle = document.getElementById('song-title');
        const songMeta = document.getElementById('song-meta');
        const lyricsDisplay = document.getElementById('lyrics-display');
        const loopModeTag = document.getElementById('loop-mode-tag');

        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const rewindBtn = document.getElementById('rewind-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');

        const volumeBar = document.getElementById('volume-bar');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const loopToggleBtn = document.getElementById('loop-toggle-btn');
        const loopBtnText = document.getElementById('loop-btn-text');

        const shortcutsBtn = document.getElementById('shortcuts-btn');
        const shortcutsModal = document.getElementById('shortcuts-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        let parsedLyrics = [];
        let currentFileName = "";

        // iOS Audio Session 設定（マナーモード回避 & バックグラウンド再生維持）
        if ('audioSession' in navigator) {
            try {
                navigator.audioSession.type = 'playback';
            } catch (e) {
                console.log('AudioSession 設定非対応');
            }
        }

        // LRC Parser
        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            lines.forEach(line => {
                const match = timeRegex.exec(line);
                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    const milliseconds = parseInt(match[3].padEnd(3, '0'), 10);
                    const time = minutes * 60 + seconds + milliseconds / 1000;
                    const text = line.replace(timeRegex, '').trim();
                    if (text) result.push({ time, text });
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('drop', e => {
            const files = Array.from(e.dataTransfer.files);
            const audioFile = files.find(f => f.type.startsWith('audio/') || f.name.endsWith('.m4a'));
            const lrcFile = files.find(f => f.name.endsWith('.lrc'));

            if (lrcFile) handleLrcFile(lrcFile);
            if (audioFile) handleAudioFile(audioFile);
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) handleAudioFile(e.target.files[0]);
        });

        lrcInput.addEventListener('change', e => {
            if (e.target.files.length > 0) handleLrcFile(e.target.files[0]);
        });

        function handleLrcFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                parsedLyrics = parseLRC(e.target.result);
                lyricsDisplay.textContent = '♪ 歌詞が読み込まれました';
                updateMediaSession();
            };
            reader.readAsText(file);
        }

        function handleAudioFile(file) {
            currentFileName = file.name.replace(/\.[^/.]+$/, "");
            songTitle.textContent = currentFileName;
            
            uploadPrompt.classList.add('hidden');
            trackInfo.classList.remove('hidden');
            trackInfo.classList.add('flex');

            if (parsedLyrics.length === 0) {
                lyricsDisplay.textContent = '♪ 歌詞 (.lrc) をドロップで追加できます';
            }

            const objectUrl = URL.createObjectURL(file);
            audioPlayer.src = objectUrl;
            audioPlayer.volume = volumeBar.value;
            audioPlayer.loop = true;

            audioPlayer.play().then(() => {
                updatePlayButtonUI(true);
                setupMediaSession();
            }).catch(err => console.log("再生エラー:", err));

            songMeta.textContent = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;
        }

        // Audio Player Events
        audioPlayer.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audioPlayer.duration);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (!audioPlayer.duration) return;
            const current = audioPlayer.currentTime;
            currentTimeEl.textContent = formatTime(current);
            seekBar.value = (current / audioPlayer.duration) * 100;

            // 歌詞の同期
            if (parsedLyrics.length > 0) {
                let currentText = '';
                for (let i = 0; i < parsedLyrics.length; i++) {
                    if (current >= parsedLyrics[i].time) {
                        currentText = parsedLyrics[i].text;
                    } else {
                        break;
                    }
                }
                if (lyricsDisplay.textContent !== currentText && currentText !== '') {
                    lyricsDisplay.textContent = currentText;
                }
            }
        });

        seekBar.addEventListener('input', () => {
            if (!audioPlayer.duration) return;
            audioPlayer.currentTime = (seekBar.value / 100) * audioPlayer.duration;
        });

        // Controls
        playBtn.addEventListener('click', () => {
            if (!audioPlayer.src) return;
            if (audioPlayer.paused) {
                audioPlayer.play();
                updatePlayButtonUI(true);
            } else {
                audioPlayer.pause();
                updatePlayButtonUI(false);
            }
        });

        function updatePlayButtonUI(isPlaying) {
            playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play ml-1';
        }

        rewindBtn.addEventListener('click', () => audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5));
        forwardBtn.addEventListener('click', () => audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5));

        loopToggleBtn.addEventListener('click', () => {
            audioPlayer.loop = !audioPlayer.loop;
            if (audioPlayer.loop) {
                loopToggleBtn.className = 'p-2.5 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-600/30 transition flex items-center gap-2';
                loopBtnText.textContent = '無限ループ ON';
                loopModeTag.textContent = '無限ループ有効';
            } else {
                loopToggleBtn.className = 'p-2.5 rounded-xl bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 transition flex items-center gap-2';
                loopBtnText.textContent = 'ループ OFF';
                loopModeTag.textContent = '1回のみ再生';
            }
        });

        volumeBar.addEventListener('input', (e) => {
            audioPlayer.volume = parseFloat(e.target.value);
        });

        // iOS Media Session (ロック画面コントロール)
        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: currentFileName || 'Unknown Track',
                    artist: 'Endless Loop Player',
                    album: 'Local Audio'
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    audioPlayer.play();
                    updatePlayButtonUI(true);
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    audioPlayer.pause();
                    updatePlayButtonUI(false);
                });
                navigator.mediaSession.setActionHandler('seekbackward', () => audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5));
                navigator.mediaSession.setActionHandler('seekforward', () => audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5));
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        shortcutsBtn.addEventListener('click', () => shortcutsModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => shortcutsModal.classList.add('hidden'));
    </script>
</body>
</html>
